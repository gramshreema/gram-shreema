name: Build Shreema APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Gram Shreema APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Find project ZIP
        run: |
          echo "===== ZIP FILES ====="
          find . -type f -name "*.zip" -print
          echo "===================="

      - name: Extract Android project
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d project

          echo "===== EXTRACTED FILES ====="
          find project -maxdepth 6 -type f | sort | head -300
          echo "==========================="

      - name: Find Gradle project
        run: |
          SETTINGS_FILE=$(find project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."

            echo "===== BUILD GRADLE FILES ====="
            find project -type f \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) -print
            echo "=============================="

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Grdle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check important project files
        run: |
          echo "===== PROJECT DIRECTORY ====="
          cd "$PROJECT_DIR"
          pwd
          ls -la
          echo "============================="

          echo "===== GRADLE FILES ====="
          find . -maxdepth 3 -type f \( \
            -name "settings.gradle" \
            -o -name "build.gradle" \
            -o -name "gradle.properties" \
          \) -print
          echo "========================"
      - name: Show app build.gradle
        run: |
          cd "$PROJECT_DIR"
          echo "===== app/build.gradle ====="
          cat app/build.gradle
          echo "============================"

      - name: Fix FirebaseException import
        run: |
          sed -i '/import com.google.firebase.FirebaseException;/d' "$PROJECT_DIR/app/src/main/java/com/shreema/gramshikayat/MainActivity.java"
          sed -i '/import android.os.Bundle;/a import com.google.firebase.FirebaseException;' "$PROJECT_DIR/app/src/main/java/com/shreema/gramshikayat/MainActivity.java"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
        run: |
          cd "$PROJECT_DIR"
          echo "===== app/build.gradle ====="
          cat app/build.gradle
          echo "============================"
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          echo "===== BUILD START ====="
          pwd
          ls -la
          echo "======================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Find generated APK
        run: |
          echo "===== SEARCHING FOR APK ====="

          APK_FILE=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          ls -lh "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Verify APK
        run: |
          echo "===== VERIFY APK ====="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK_FILE"

      - name: Show APK information
        run: |
          echo "===== APK INFORMATION ====="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK_FILE" | head -25

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gram-shreema-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
