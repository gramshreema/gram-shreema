name: Build Shreema APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Gram Shreema APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Save new MainActivity
        run: |
          MAIN_FILE=$(find . -type f -name "MainActivity.java" | head -1)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: New MainActivity.java not found."
            exit 1
          fi

          echo "MAIN_FILE=$MAIN_FILE" >> "$GITHUB_ENV"
          echo "Using: $MAIN_FILE"
      - name: Find project ZIP
        run: |
          echo "===== ZIP FILES ====="
          find . -type f -name "*.zip" -print
          echo "===================="

      - name: Extract Android project
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -type f -name "ShreemaGram_GitHub_APK_Build_Project.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project

      - name: Find Gradle project
        run: |
          SETTINGS_FILE=$(find project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project found:"
          echo "$PROJECT_DIR"
            - name: Replace MainActivity with Gmail Login
        run: |
          FILE=$(find project -type f -path "*/app/src/main/java/com/shreema/gramshikayat/MainActivity.java" | head -1)

          if [ -z "$FILE" ]; then
            echo "ERROR: MainActivity.java not found inside project ZIP."
            exit 1
          fi

          cat > "$FILE" <<'EOF'
package com.shreema.gramshikayat;

import android.app.Activity;
import android.os.Bundle;
import android.text.InputType;
import android.widget.*;

import com.google.firebase.auth.FirebaseAuth;

public class MainActivity extends Activity {

    FirebaseAuth auth;

    EditText email, password;
    Button loginButton;
    TextView status;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        auth = FirebaseAuth.getInstance();

        LinearLayout layout = new LinearLayout(this);
        layout.setOrientation(LinearLayout.VERTICAL);
        layout.setPadding(30, 30, 30, 30);

        TextView title = new TextView(this);
        title.setText("Gram Shreema");
        title.setTextSize(28);
        layout.addView(title);

        TextView subtitle = new TextView(this);
        subtitle.setText("Gmail Login");
        subtitle.setTextSize(20);
        layout.addView(subtitle);

        email = new EditText(this);
        email.setHint("Gmail / Email");
        email.setInputType(InputType.TYPE_CLASS_TEXT |
                InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS);
        layout.addView(email);

        password = new EditText(this);
        password.setHint("Password");
        password.setInputType(InputType.TYPE_CLASS_TEXT |
                InputType.TYPE_TEXT_VARIATION_PASSWORD);
        layout.addView(password);

        loginButton = new Button(this);
        loginButton.setText("Login");
        layout.addView(loginButton);

        status = new TextView(this);
        status.setTextSize(16);
        layout.addView(status);

        setContentView(layout);

        loginButton.setOnClickListener(v -> login());
    }

    void login() {

        String userEmail = email.getText().toString().trim();
        String userPassword = password.getText().toString().trim();

        if (userEmail.isEmpty()) {
            status.setText("Email डालें");
            return;
        }

        if (userPassword.isEmpty()) {
            status.setText("Password डालें");
            return;
        }

        loginButton.setEnabled(false);
        status.setText("Login हो रहा है...");

        auth.signInWithEmailAndPassword(userEmail, userPassword)
                .addOnCompleteListener(task -> {

                    loginButton.setEnabled(true);

                    if (task.isSuccessful()) {
                        status.setText("Login successful");
                    } else {
                        String message = "Login failed";

                        if (task.getException() != null) {
                            message = "Login failed: " +
                                    task.getException().getMessage();
                        }

                        status.setText(message);
                    }
                });
    }
}
EOF

          echo "New Gmail MainActivity installed."
      - name: Check MainActivity
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/shreema/gramshikayat/MainActivity.java"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "MainActivity.java found."

      - name: Set app version
        run: |
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          sed -i 's/versionCode[[:space:]]*[0-9]*/versionCode 3/' "$GRADLE_FILE"
          sed -i 's/versionName[[:space:]]*["'\''][^"'\'']*["'\'']/versionName "3.0"/' "$GRADLE_FILE"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Find generated APK
        run: |
          APK_FILE=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          ls -lh "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gram-shreema-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
