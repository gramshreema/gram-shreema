name: Build Shreema APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ls -la
          unzip -o ShreemaGram_GitHub_APK_Build_Project.zip -d project
          echo "ZIP extracted successfully"
          ls -la project
      
      - name: Fix FirebaseException import
        run: |
          FILE="project/app/src/main/java/com/shreema/gramshikayat/MainActivity.java"
          if ! grep -q "import com.google.firebase.FirebaseException;" "$FILE"; then
            sed -i '/^import /i import com.google.firebase.FirebaseException;' "$FILE"
          fi
          grep -n "FirebaseException" "$FILE"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gram-shreema-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
