name: Build Shreema APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Gram Shreema APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Check project files
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 -type f | sort
          echo "========================"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Check APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: app-debug.apk was not generated."
            exit 1
          fi

          echo "APK SUCCESSFULLY GENERATED"
          ls -lh "$APK"

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Show APK information
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gram-shreema-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
