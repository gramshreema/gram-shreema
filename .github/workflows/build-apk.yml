name: Build Shreema APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Gram Shreema APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -type f -name "ShreemaGram_GitHub_APK_Build_Project.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Find Gradle project
        run: |
          SETTINGS_FILE=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT: $PROJECT_DIR"

      - name: Check project
        run: |
          cd "$PROJECT_DIR"
          echo "===== PROJECT ====="
          ls -la
          echo "==================="

          test -f settings.gradle
          test -f app/build.gradle

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Set app version
        run: |
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          sed -i 's/versionCode[[:space:]]*[0-9]*/versionCode 3/' "$GRADLE_FILE"

          sed -i "s/versionName[[:space:]]*[\"'][^\"']*[\"']/versionName \"3.0\"/" "$GRADLE_FILE"

          grep -n "versionCode\|versionName" "$GRADLE_FILE"
      - name: Replace OTP with Email Login
        run: |
          FILE=$(find "$PROJECT_DIR" -type f -name "MainActivity.java" | head -1)

          cat > "$FILE" <<'EOF'
package com.shreema.gramshikayat;

import android.app.Activity;
import android.os.Bundle;
import android.text.InputType;
import android.widget.*;
import com.google.firebase.auth.FirebaseAuth;

public class MainActivity extends Activity {

    FirebaseAuth auth;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        auth = FirebaseAuth.getInstance();

        LinearLayout layout = new LinearLayout(this);
        layout.setOrientation(LinearLayout.VERTICAL);
        layout.setPadding(30, 30, 30, 30);

        TextView title = new TextView(this);
        title.setText("ग्राम श्रीमा शिकायत ऐप");
        title.setTextSize(26);
        layout.addView(title);

        EditText email = new EditText(this);
        email.setHint("Email ID");
        email.setInputType(InputType.TYPE_CLASS_TEXT |
                InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS);
        layout.addView(email);

        EditText password = new EditText(this);
        password.setHint("Password");
        password.setInputType(InputType.TYPE_CLASS_TEXT |
                InputType.TYPE_TEXT_VARIATION_PASSWORD);
        layout.addView(password);

        Button login = new Button(this);
        login.setText("Login");
        layout.addView(login);

        TextView status = new TextView(this);
        layout.addView(status);

        setContentView(layout);

        login.setOnClickListener(v -> {

            String e = email.getText().toString().trim();
            String p = password.getText().toString().trim();

            if (e.isEmpty() || p.isEmpty()) {
                status.setText("Email और Password डालें");
                return;
            }

            login.setEnabled(false);
            status.setText("Login हो रहा है...");

            auth.signInWithEmailAndPassword(e, p)
                    .addOnCompleteListener(task -> {

                        login.setEnabled(true);

                        if (task.isSuccessful()) {
                            status.setText("Login सफल हुआ");
                        } else {
                            status.setText("Login असफल");
                        }
                    });
        });
    }
}
EOF
      
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          
              gradle clean assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

          ls -lh "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gram-shreema-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
