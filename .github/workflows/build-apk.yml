name: Build Shreema APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Gram Shreema APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Find project ZIP
        run: |
          echo "===== ZIP FILES ====="
          find . -type f -name "*.zip" -print
          echo "===================="

      - name: Extract Android project
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -type f -name "ShreemaGram_GitHub_APK_Build_Project_New.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "New ZIP not found. Searching for any project ZIP..."
            ZIP_FILE=$(find . -type f -name "*.zip" | head -1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d project

          echo "===== EXTRACTED FILES ====="
          find project -maxdepth 8 -type f | sort | head -500
          echo "==========================="

      - name: Find Gradle project
        run: |
          SETTINGS_FILE=$(find project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check important project files
        run: |
          echo "===== PROJECT DIRECTORY ====="
          cd "$PROJECT_DIR"
          pwd
          ls -la
          echo "============================="

          echo "===== GRADLE FILES ====="
          find . -maxdepth 3 -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle.properties" \
          \) -print
          echo "========================"

      - name: Check MainActivity.java
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/shreema/gramshikayat/MainActivity.java"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "===== MainActivity.java ====="
          ls -lh "$FILE"
          file "$FILE"
          echo "============================="

      - name: Show app build.gradle
        run: |
          cd "$PROJECT_DIR"

          echo "===== app/build.gradle ====="
          cat app/build.gradle
          echo "============================"

      - name: Set new app version
        run: |
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          sed -i 's/versionCode[[:space:]]*[0-9]*/versionCode 3/' "$GRADLE_FILE"

          sed -i 's/versionName[[:space:]]*["'\''][^"'\'']*["'\'']/versionName "3.0"/' "$GRADLE_FILE"

          echo "===== APP VERSION ====="
          grep -n "versionCode\|versionName" "$GRADLE_FILE"
          echo "======================="

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          echo "===== BUILD START ====="
          pwd
          ls -la
          echo "======================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Find generated APK
        run: |
          echo "===== SEARCHING FOR APK ====="

          APK_FILE=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          ls -lh "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Verify APK
        run: |
          echo "===== VERIFY APK ====="

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner | sort -V | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK_FILE"

      - name: Show APK information
        run: |
          echo "===== APK INFORMATION ====="

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -name aapt | sort -V | tail -1)

          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt not found."
            exit 1
          fi

          "$AAPT" dump badging "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gram-shreema-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
